<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">The Endless Codex</title>
  <desc id="desc">A gold infinity symbol above an open book on a dark fantasy background.</desc>

  <defs>
    <linearGradient id="bg" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#08111b"/>
      <stop offset="0.52" stop-color="#0d1722"/>
      <stop offset="1" stop-color="#05090f"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="31%" r="58%">
      <stop offset="0" stop-color="#214a66" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#142637" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="11" y1="13" x2="53" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a4619"/>
      <stop offset=".22" stop-color="#d29435"/>
      <stop offset=".42" stop-color="#f4c66f"/>
      <stop offset=".58" stop-color="#a9621d"/>
      <stop offset=".8" stop-color="#e8ae4c"/>
      <stop offset="1" stop-color="#6d3b14"/>
    </linearGradient>

    <linearGradient id="paper" x1="11" y1="32" x2="52" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5d3818"/>
      <stop offset=".35" stop-color="#c28a42"/>
      <stop offset=".5" stop-color="#edc97b"/>
      <stop offset=".66" stop-color="#a86b2c"/>
      <stop offset="1" stop-color="#4e2f18"/>
    </linearGradient>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.05" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0.84
                0 0.55 0 0 0.38
                0 0 0.12 0 0.05
                0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect x="2" y="2" width="60" height="60" rx="13"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#bg)"/>
    <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#halo)"/>

    <!-- faint ornamental frame -->
    <rect x="5.25" y="5.25" width="53.5" height="53.5" rx="10" fill="none" stroke="#8d5a28" stroke-opacity=".28" stroke-width=".8"/>
    <path d="M8.5 17.5V10h7.5M48 10h7.5v7.5M8.5 46.5V54h7.5M48 54h7.5v-7.5"
          fill="none" stroke="#b47a36" stroke-opacity=".24" stroke-width=".7"/>

    <!-- small star above the mark -->
    <path d="M32 8.6l.9 2.2 2.2.9-2.2.9-.9 2.2-.9-2.2-2.2-.9 2.2-.9z"
          fill="#d8a348" opacity=".58"/>

    <!-- infinity -->
    <path
      d="M12.7 23.1
         C12.7 17.5 17 13.5 22.2 13.5
         C26.2 13.5 29.4 16.1 32 19.5
         C34.6 16.1 37.8 13.5 41.8 13.5
         C47 13.5 51.3 17.5 51.3 23.1
         C51.3 28.7 47.1 32.8 41.8 32.8
         C37.7 32.8 34.5 30.2 32 26.8
         C29.5 30.2 26.3 32.8 22.2 32.8
         C16.9 32.8 12.7 28.7 12.7 23.1
         Z
         M17.2 23.1
         C17.2 26 19.3 28 22.2 28
         C24.9 28 27 26.2 29.2 23.1
         C27 20 24.9 18.3 22.2 18.3
         C19.3 18.3 17.2 20.2 17.2 23.1
         Z
         M34.8 23.1
         C37 26.2 39.1 28 41.8 28
         C44.7 28 46.8 26 46.8 23.1
         C46.8 20.2 44.7 18.3 41.8 18.3
         C39.1 18.3 37 20 34.8 23.1
         Z"
      fill="url(#gold)" fill-rule="evenodd"
      stroke="#f0bd60" stroke-opacity=".4" stroke-width=".6"
      filter="url(#goldGlow)"/>

    <!-- open codex -->
    <path d="M9.5 35.4
             C16.2 33.5 24.9 34 31.2 38
             L31.2 48.9
             C25 45.1 16.4 44.4 9.5 46.4
             Z"
          fill="url(#paper)" stroke="#d39a47" stroke-opacity=".65" stroke-width=".7"/>
    <path d="M54.5 35.4
             C47.8 33.5 39.1 34 32.8 38
             L32.8 48.9
             C39 45.1 47.6 44.4 54.5 46.4
             Z"
          fill="url(#paper)" stroke="#d39a47" stroke-opacity=".65" stroke-width=".7"/>

    <!-- book depth -->
    <path d="M9.8 46.5c7.9-1.9 15.4-.8 21.4 2.9M54.2 46.5c-7.9-1.9-15.4-.8-21.4 2.9"
          fill="none" stroke="#6e421e" stroke-width="2" stroke-linecap="round"/>
    <path d="M31.2 38.2v11.2M32.8 38.2v11.2"
          stroke="#4a2a13" stroke-width=".7" opacity=".8"/>

    <!-- subtle page lines -->
    <path d="M13.5 38.3c5.5-1.1 10.8-.3 15.3 2.1
             M13.4 41.3c5.2-1 10.4-.3 15 2
             M50.5 38.3c-5.5-1.1-10.8-.3-15.3 2.1
             M50.6 41.3c-5.2-1-10.4-.3-15 2"
          fill="none" stroke="#68401d" stroke-opacity=".65" stroke-width=".55" stroke-linecap="round"/>

    <!-- lower divider / tiny accent -->
    <path d="M24.5 53h15" stroke="#b07732" stroke-opacity=".45" stroke-width=".65"/>
    <path d="M32 51.7l1.15 1.3L32 54.3 30.85 53z" fill="#d0a15a" opacity=".72"/>
  </g>

  <rect x="2" y="2" width="60" height="60" rx="13" fill="none" stroke="#b57b36" stroke-opacity=".18"/>
</svg>
